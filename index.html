<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Bunni POS</title>
<meta name="theme-color" content="#5a1418">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bunni POS">
<link rel="apple-touch-icon" href="img/icon-180.png">
<link rel="icon" href="img/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><img src="img/logo.png" alt="BNY"><span>Bunni POS</span></div>
    <nav class="tabs">
      <button data-view="pos" class="active" data-i18n>الكاشير</button>
      <button data-view="orders" data-i18n>الطلبات</button>
      <button data-view="settings" data-i18n>الإعدادات</button>
    </nav>
    <div class="clock" id="clock"></div>
    <button class="lang-btn" id="langToggle" aria-label="Switch language">English</button>
  </header>

  <main id="view-pos" class="view pos">
    <section class="catalog">
      <div class="cats" id="cats"></div>
      <div class="grid" id="grid"></div>
    </section>
    <aside class="cart">
      <button class="cart-bar" id="cartBar" type="button">
        <span id="cartBarInfo"></span>
        <b id="cartBarTotal"></b>
        <span class="cart-bar-act" id="cartBarAct"></span>
      </button>
      <div class="cart-head">
        <h2><span data-i18n>الطلب</span> <span id="orderNo"></span></h2>
        <button class="link danger" id="clearCart" data-i18n>تفريغ</button>
      </div>
      <div class="cart-lines" id="cartLines"></div>
      <div class="cart-foot">
        <div class="row" id="pagerRow">
          <label for="pager" data-i18n>رقم البيجر</label>
          <select id="pager" class="input pager-select"></select>
        </div>
        <input id="orderNote" class="input" data-i18n-ph placeholder="ملاحظة على الطلب (اختياري)" maxlength="80">
        <div class="row">
          <label for="discount" data-i18n>خصم (ر.س)</label>
          <input id="discount" class="input small" type="number" inputmode="decimal" min="0" step="0.5" value="">
        </div>
        <div class="totals">
          <div class="row"><span data-i18n>المجموع</span><span id="subTotal">0</span></div>
          <div class="row total"><span data-i18n>الإجمالي</span><span id="grandTotal">0</span></div>
        </div>
        <div class="pay" id="payMethods">
          <button data-pay="cash" class="active" data-i18n>كاش</button>
          <button data-pay="card" data-i18n>شبكة</button>
          <button data-pay="split" data-i18n>كاش + شبكة</button>
        </div>
        <div class="cash" id="cashBox" hidden>
          <div class="row">
            <label for="received" data-i18n>المبلغ المستلم</label>
            <input id="received" class="input small" type="number" inputmode="decimal" min="0" step="0.5" placeholder="0">
          </div>
          <div class="quick" id="quickCash"></div>
          <div class="row change"><span data-i18n>الباقي للزبون</span><span id="changeDue">—</span></div>
          <button class="rest-card" id="payRestCard" hidden></button>
        </div>
        <div class="cash split" id="splitBox" hidden>
          <div class="row">
            <label for="splitCash" data-i18n>المبلغ كاش</label>
            <input id="splitCash" class="input small" type="number" inputmode="decimal" min="0" step="0.5" placeholder="0">
          </div>
          <div class="row change card-part"><span data-i18n>على الشبكة</span><span id="splitCard">—</span></div>
        </div>
        <button class="primary" id="checkout" disabled data-i18n>دفع وطباعة</button>
      </div>
    </aside>
  </main>

  <main id="view-orders" class="view" hidden>
    <div class="panel">
      <div class="panel-head">
        <h2><span data-i18n>طلبات يوم</span> <input type="date" id="ordersDate" class="input small"></h2>
        <div class="head-actions">
          <button class="secondary" id="ordersCloud" data-i18n>جلب من السحابة</button>
          <button class="secondary" id="exportCsv" data-i18n>تصدير CSV</button>
        </div>
      </div>
      <div class="stats" id="stats"></div>
      <div class="orders" id="ordersList"></div>
    </div>
  </main>

  <main id="view-settings" class="view" hidden>
    <div class="panel">
      <h2 data-i18n>المتجر والفاتورة</h2>
      <div class="form">
        <label><span data-i18n>اسم المتجر على الفاتورة</span> <input id="setShop" class="input"></label>
        <label><span data-i18n>تذييل الفاتورة</span> <input id="setFooter" class="input"></label>
        <label class="check"><input type="checkbox" id="setVat"> <span data-i18n>إظهار ضريبة القيمة المضافة 15% (الأسعار شاملة)</span></label>
        <label><span data-i18n>الرقم الضريبي</span> <input id="setVatNo" class="input" inputmode="numeric"></label>
      </div>

      <h2 data-i18n>الطابعة</h2>
      <div class="form">
        <label><span data-i18n>طريقة الطباعة</span>
          <select id="setPrintMode" class="input">
            <option value="airprint" data-i18n>AirPrint (نافذة طباعة الآيباد)</option>
            <option value="tmassist" data-i18n>تطبيق Epson TM Print Assistant (موصى به لـ TM-T20III)</option>
            <option value="epson" data-i18n>Epson ePOS عبر الشبكة (طباعة مباشرة بدون نافذة)</option>
            <option value="none" data-i18n>بدون طباعة</option>
          </select>
        </label>
        <label><span data-i18n>لغة الفاتورة</span>
          <select id="setReceiptLang" class="input"><option value="en">English</option><option value="ar">العربية</option></select>
        </label>
        <label class="check"><input type="checkbox" id="setPrepCopy"> <span data-i18n>طباعة نسختين: نسخة الزبون + نسخة التحضير للباريستا (بدون أسعار)</span></label>
        <label><span data-i18n>عرض الورق</span>
          <select id="setPaper" class="input"><option value="80">80mm</option><option value="58">58mm</option></select>
        </label>
        <label id="ipRow"><span data-i18n>عنوان IP للطابعة</span> <input id="setIp" class="input" placeholder="192.168.1.50" inputmode="decimal" dir="ltr"></label>
        <p class="hint" id="printHint"></p>
        <label><span data-i18n>عدد البيجرات (0 لإخفاء خيار البيجر)</span> <input id="setPagers" class="input small" type="number" inputmode="numeric" min="0" max="99"></label>
        <div><button class="secondary" id="testPrint" data-i18n>طباعة تجريبية</button></div>
      </div>

      <h2 data-i18n>السحابة وسجل التحديثات</h2>
      <div class="form">
        <label><span data-i18n>رمز السحابة</span> <input id="setCloudKey" class="input" type="password" autocomplete="off" dir="ltr"></label>
        <p class="hint" id="cloudStatus"></p>
        <div><button class="secondary" id="cloudSync" data-i18n>مزامنة الآن وعرض السجل</button></div>
        <div class="cloud-log" id="cloudLog"></div>
      </div>

      <h2 data-i18n>تيليجرام</h2>
      <div class="form">
        <p class="hint" id="tgStatus"></p>
        <div class="head-actions">
          <button class="secondary" id="tgLink" data-i18n>ربط تيليجرام</button>
          <button class="secondary" id="tgTest" data-i18n>رسالة تجريبية</button>
          <button class="secondary" id="tgSummary" data-i18n>إرسال ملخص اليوم</button>
        </div>
      </div>

      <h2 data-i18n>الأصناف والأسعار</h2>
      <p class="hint" data-i18n>غيّر السعر أو أخفِ الصنف مؤقتاً. التغييرات تُحفظ على هذا الجهاز وفي السحابة.</p>
      <div class="menu-edit" id="menuEdit"></div>
    </div>
  </main>
</div>

<div id="toast" class="toast" hidden></div>
<div id="receipt" class="receipt" aria-hidden="true"></div>

<script src="menu.js"></script>
<script src="app.js"></script>
</body>
</html>
